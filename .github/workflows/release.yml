name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.0)'
        required: true
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: '22.18.0'
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: windows-latest
    name: Verify

    steps:
      - name: Validate manual release tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -ne "tag") {
            throw "Manual releases must be run from an existing tag ref. Create and push '${{ inputs.tag }}', then choose that tag in GitHub's 'Use workflow from' selector."
          }

          if ("${{ github.ref_name }}" -ne "${{ inputs.tag }}") {
            throw "The selected workflow ref '${{ github.ref_name }}' must match the tag input '${{ inputs.tag }}'."
          }

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

  build-windows-signed:
    runs-on: windows-latest
    name: Build signed Windows installer
    needs: verify
    environment: release
    permissions:
      contents: read
      id-token: write

    env:
      AZURE_SIGNING_ENABLED: '1'
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_SIGNING_ACCOUNT_NAME }}
      AZURE_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_SIGNING_CERTIFICATE_PROFILE_NAME }}
      AZURE_SIGNING_PUBLISHER_NAME: ${{ vars.AZURE_SIGNING_PUBLISHER_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build signed Windows installer
        run: npm run package -- --win --x64 --publish never

      - name: Verify Authenticode signatures
        shell: pwsh
        run: |
          $installerFiles = Get-ChildItem -Path release -File -Filter *.exe
          $appFiles = Get-ChildItem -Path release\win-unpacked -File -Filter *.exe -Recurse
          $targets = @($installerFiles) + @($appFiles)

          if ($targets.Count -eq 0) {
            throw "No executable files were produced for signature verification."
          }

          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature -FilePath $target.FullName
            Write-Host "$($target.FullName): $($signature.Status)"

            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature for $($target.FullName): $($signature.StatusMessage)"
            }
          }

      - name: Verify updater metadata
        shell: pwsh
        run: |
          $installerFiles = @(Get-ChildItem -Path release -File -Filter *.exe | Sort-Object Name)

          if ($installerFiles.Count -eq 0) {
            throw "No installer executables were produced."
          }

          $latestYml = Get-Item -Path release\latest.yml -ErrorAction SilentlyContinue
          if (-not $latestYml) {
            throw "latest.yml was not produced. Check electron-builder publish configuration."
          }

          $latestContent = Get-Content -Path $latestYml.FullName -Raw
          if ($latestContent -notmatch "sha512") {
            throw "latest.yml does not contain SHA512 update metadata."
          }

          foreach ($installer in $installerFiles) {
            $blockmapPath = "$($installer.FullName).blockmap"
            if (-not (Test-Path -LiteralPath $blockmapPath)) {
              throw "Missing updater blockmap for $($installer.Name)."
            }

            if ($latestContent -notmatch [regex]::Escape($installer.Name)) {
              throw "latest.yml does not reference $($installer.Name)."
            }
          }

      - name: Generate checksums
        shell: pwsh
        run: |
          $releaseFiles = @(
            Get-ChildItem -Path release -File -Filter *.exe
            Get-ChildItem -Path release -File -Filter *.exe.blockmap
            Get-Item -Path release\latest.yml
          ) | Sort-Object Name

          if ($releaseFiles.Count -eq 0) {
            throw "No release files were produced for checksum generation."
          }

          $checksums = foreach ($file in $releaseFiles) {
            $hash = Get-FileHash -Path $file.FullName -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant())  $($file.Name)"
          }

          $checksums | Set-Content -Path release\SHA256SUMS.txt -Encoding ascii

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paper-pilot-windows-signed
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    name: Publish GitHub release
    needs: build-windows-signed
    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download signed release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' files < <(find release-artifacts -type f \( -name '*.exe' -o -name '*.exe.blockmap' -o -name 'latest.yml' -o -name 'SHA256SUMS.txt' \) -print0 | sort -z)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release files were downloaded." >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${files[@]}" --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
