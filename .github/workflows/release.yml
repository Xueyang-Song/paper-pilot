name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Commit SHA on main to release or repair
        required: true
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: "22.18.0"

concurrency:
  group: release-${{ github.event.workflow_run.head_sha || inputs.target_sha }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan release
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == github.repository)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || inputs.target_sha }}
      GH_TOKEN: ${{ github.token }}
    outputs:
      status: ${{ steps.release-plan.outputs.status }}
      version: ${{ steps.release-plan.outputs.version }}
      tag: ${{ steps.release-plan.outputs.tag }}
      target_sha: ${{ steps.release-plan.outputs.target_sha }}
      notes_base64: ${{ steps.release-plan.outputs.notes_base64 }}
    steps:
      - name: Checkout target commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Fetch main and release tags
        run: git fetch origin main:refs/remotes/origin/main --tags --force
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Calculate release plan
        id: release-plan
        run: node scripts/release-plan.mjs --repository "$GITHUB_REPOSITORY" --target-sha "$TARGET_SHA"

  build-windows-signed:
    name: Build signed Windows installer
    if: ${{ needs.plan.outputs.status != 'complete' }}
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 35
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      AZURE_SIGNING_ENABLED: "1"
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_SIGNING_ACCOUNT_NAME }}
      AZURE_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_SIGNING_CERTIFICATE_PROFILE_NAME }}
      AZURE_SIGNING_PUBLISHER_NAME: ${{ vars.AZURE_SIGNING_PUBLISHER_NAME }}
    steps:
      - name: Checkout target commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.target_sha }}
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Inject release version
        shell: pwsh
        run: npm version $env:RELEASE_VERSION --no-git-tag-version
      - name: Azure login
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build signed Windows installer
        run: npm run package -- --win --x64 --publish never
      - name: Verify Authenticode signatures
        shell: pwsh
        run: |
          $installerFiles = Get-ChildItem -Path release -File -Filter *.exe
          $appFiles = Get-ChildItem -Path release\win-unpacked -File -Filter *.exe -Recurse
          $targets = @($installerFiles) + @($appFiles)
          if ($targets.Count -eq 0) { throw "No executable files were produced for signature verification." }
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature -FilePath $target.FullName
            Write-Host "$($target.FullName): $($signature.Status)"
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature for $($target.FullName): $($signature.StatusMessage)"
            }
          }
      - name: Verify updater metadata
        shell: pwsh
        run: |
          $installerFiles = @(Get-ChildItem -Path release -File -Filter *.exe | Sort-Object Name)
          if ($installerFiles.Count -eq 0) { throw "No installer executables were produced." }
          $latestYml = Get-Item -Path release\latest.yml -ErrorAction SilentlyContinue
          if (-not $latestYml) { throw "latest.yml was not produced." }
          $latestContent = Get-Content -Path $latestYml.FullName -Raw
          if ($latestContent -notmatch "sha512") { throw "latest.yml does not contain SHA512 update metadata." }
          foreach ($installer in $installerFiles) {
            $blockmapPath = "$($installer.FullName).blockmap"
            if (-not (Test-Path -LiteralPath $blockmapPath)) { throw "Missing updater blockmap for $($installer.Name)." }
            if ($latestContent -notmatch [regex]::Escape($installer.Name)) {
              throw "latest.yml does not reference $($installer.Name)."
            }
          }
      - name: Generate checksums
        shell: pwsh
        run: |
          $releaseFiles = @(
            Get-ChildItem -Path release -File -Filter *.exe
            Get-ChildItem -Path release -File -Filter *.exe.blockmap
            Get-Item -Path release\latest.yml
          ) | Sort-Object Name
          if ($releaseFiles.Count -eq 0) { throw "No release files were produced for checksum generation." }
          $checksums = foreach ($file in $releaseFiles) {
            $hash = Get-FileHash -Path $file.FullName -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant())  $($file.Name)"
          }
          $checksums | Set-Content -Path release\SHA256SUMS.txt -Encoding ascii
      - name: Verify checksums
        shell: pwsh
        run: |
          $lines = Get-Content -Path release\SHA256SUMS.txt
          if ($lines.Count -ne 3) { throw "Expected checksums for the installer, blockmap, and latest.yml." }
          foreach ($line in $lines) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw "Malformed checksum line: $line" }
            $expectedHash = $Matches[1]
            $fileName = $Matches[2]
            $filePath = Join-Path release $fileName
            if (-not (Test-Path -LiteralPath $filePath)) { throw "Checksum references missing file: $fileName" }
            $actualHash = (Get-FileHash -LiteralPath $filePath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $expectedHash) { throw "Checksum mismatch for $fileName" }
          }
      - name: Upload signed release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paper-pilot-windows-${{ needs.plan.outputs.version }}
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub release
    if: ${{ needs.plan.outputs.status != 'complete' }}
    needs: [plan, build-windows-signed]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      TARGET_SHA: ${{ needs.plan.outputs.target_sha }}
      NOTES_BASE64: ${{ needs.plan.outputs.notes_base64 }}
    steps:
      - name: Checkout target commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Download signed release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: paper-pilot-windows-${{ needs.plan.outputs.version }}
          path: release-artifacts
      - name: Publish or repair release
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags --force
          if git rev-parse "$RELEASE_TAG^{commit}" >/dev/null 2>&1; then
            tagged_sha=$(git rev-parse "$RELEASE_TAG^{commit}")
            if [ "$tagged_sha" != "$TARGET_SHA" ]; then
              echo "$RELEASE_TAG points to $tagged_sha instead of $TARGET_SHA" >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$TARGET_SHA" -m "Release $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

          printf '%s' "$NOTES_BASE64" | base64 --decode > release-notes.md
          mapfile -d '' files < <(
            find release-artifacts -type f \
              \( -name '*.exe' -o -name '*.exe.blockmap' -o -name 'latest.yml' -o -name 'SHA256SUMS.txt' \) \
              -print0 | sort -z
          )
          if [ "${#files[@]}" -ne 4 ]; then
            echo "Expected four release assets, found ${#files[@]}." >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            while IFS= read -r asset_id; do
              gh api --method DELETE "repos/{owner}/{repo}/releases/assets/$asset_id"
            done < <(gh api "repos/{owner}/{repo}/releases/tags/$RELEASE_TAG" --jq '.assets[].id')
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md \
              --draft=false \
              --prerelease=false
          else
            gh release create "$RELEASE_TAG" "${files[@]}" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md \
              --latest=false
          fi

          asset_count=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')
          if [ "$asset_count" -ne 4 ]; then
            echo "Published release has $asset_count assets instead of four." >&2
            exit 1
          fi
          latest_tag=$(
            gh api --paginate 'repos/{owner}/{repo}/releases?per_page=100' \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' |
              grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' |
              sort -V |
              tail -n 1
          )
          test -n "$latest_tag"
          gh release edit "$latest_tag" --latest
